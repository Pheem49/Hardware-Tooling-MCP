[project]
name = "hardware-tooling-mcp"
version = "0.1.0"
description = "Embedded & Hardware Tooling Bridge MCP Server — Connect AI Agents to physical hardware (USB Serial, Arduino/PlatformIO/ESP-IDF Flashing, FTDI GPIO/I2C/SPI, BLE, Webcam/Microscope, Logic Analyzer, ADB, Audio/Mic Testing, and Host Process Control)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pheem49" }
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "hardware",
    "embedded",
    "esp32",
    "arduino",
    "platformio",
    "serial",
    "ble",
    "iot",
    "ftdi",
    "gpio",
    "i2c",
    "spi",
    "sigrok",
    "adb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]
dependencies = [
    "mcp>=2.0.0",
    "pyserial>=3.5",
    "psutil>=5.9.0",
    "pyftdi>=0.55.0",
    "pyusb>=1.2.1",
    "bleak>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/Pheem49/Hardware-Tooling-MCP"
Repository = "https://github.com/Pheem49/Hardware-Tooling-MCP.git"
Issues = "https://github.com/Pheem49/Hardware-Tooling-MCP/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
hardware-tooling-mcp = "hardware_tooling_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardware_tooling_mcp"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
